<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 2000px; height: 1520px; font-family: 'DejaVu Sans', Arial, sans-serif; background: #d5573b; overflow: hidden; }
  .wrap { height: 1520px; padding: 80px 90px; display: flex; flex-direction: column; }
  .kicker { font-size: 28px; letter-spacing: 8px; text-transform: uppercase; color: #ffd9c4; font-weight: bold; text-align: center; }
  h1 { font-family: 'DejaVu Serif', Georgia, serif; font-size: 78px; color: #fff; text-align: center; margin: 18px 0 40px; }
  .pages { flex: 1; display: flex; justify-content: center; align-items: center; gap: 0; }
  .pages img { height: 980px; border-radius: 18px; box-shadow: 0 30px 60px rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.5); }
  .pages img.l { transform: rotate(-5deg) translateX(40px); }
  .pages img.c { transform: translateY(-24px); z-index: 2; }
  .pages img.r { transform: rotate(5deg) translateX(-40px); }
  .strip { display: flex; justify-content: center; gap: 18px; margin-top: 44px; }
  .strip span { background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.45); color: #fff; border-radius: 999px; padding: 14px 30px; font-size: 26px; font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">What's inside · 10 pages</div>
  <h1>Local routes, real yen budgets, checklists</h1>
  <div class="pages">
    <img class="l" src="pg3-03.png" alt="">
    <img class="c" src="pg5-05.png" alt="">
    <img class="r" src="pg6-06.png" alt="">
  </div>
  <div class="strip">
    <span>3-day local route</span><span>Day trips cheat sheet</span><span>Budget planner</span><span>+ phrases &amp; packing</span>
  </div>
</div>
</body>
</html>
