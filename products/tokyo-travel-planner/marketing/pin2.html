<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1000px; height: 1500px; font-family: 'DejaVu Sans', Arial, sans-serif; background: #d5573b; color: #fff; }
  .wrap { height: 1500px; padding: 56px; display: flex; flex-direction: column; text-align: center; align-items: center; }
  .kicker { font-size: 22px; letter-spacing: 6px; text-transform: uppercase; color: #ffd9c4; font-weight: bold; margin-top: 24px; }
  h1 { font-family: 'DejaVu Serif', Georgia, serif; font-size: 88px; line-height: 1.12; margin: 24px 0; }
  .sub { font-size: 30px; color: #ffe9dd; line-height: 1.55; }
  .mock { margin: 56px 0 40px; background: #fdf8f2; border-radius: 36px; padding: 56px 48px; width: 620px; color: #1f2429; box-shadow: 0 30px 60px rgba(0,0,0,.22); }
  .mock .mk { font-size: 16px; letter-spacing: 4px; text-transform: uppercase; color: #d5573b; font-weight: bold; }
  .mock h2 { font-family: 'DejaVu Serif', Georgia, serif; font-size: 52px; margin: 16px 0 6px; }
  .mock .jp { font-size: 20px; color: #d5573b; letter-spacing: 8px; }
  .mock svg { width: 420px; margin-top: 28px; }
  .feat { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; width: 100%; }
  .feat span { background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4); border-radius: 999px; padding: 14px 30px; font-size: 26px; }
  .brand { margin-top: auto; padding-top: 40px; font-size: 24px; letter-spacing: 4px; text-transform: uppercase; color: #ffd9c4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Printable · A4 · GoodNotes-friendly</div>
  <h1>Plan Japan like<br>a Tokyo local</h1>
  <div class="sub">A 10-page travel planner made — and updated — in Shinjuku</div>
  <div class="mock">
    <div class="mk">Made in Shinjuku, Tokyo</div>
    <h2>TOKYO TRAVEL<br>PLANNER</h2>
    <div class="jp">東京旅行プランナー</div>
    <svg viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">
      <circle cx="222" cy="62" r="40" fill="#d5573b"/>
      <rect x="36" y="88" width="26" height="44" rx="2.5" fill="#2a3038"/>
      <rect x="68" y="72" width="20" height="60" rx="2.5" fill="#2a3038"/>
      <rect x="196" y="96" width="24" height="36" rx="2.5" fill="#2a3038"/>
      <rect x="226" y="84" width="18" height="48" rx="2.5" fill="#2a3038"/>
      <polygon points="142,34 162,132 122,132" fill="#d5573b"/>
      <rect x="128" y="96" width="28" height="4.5" rx="2.2" fill="#fff"/>
      <rect x="133.5" y="66" width="17" height="4" rx="2" fill="#fff"/>
      <rect x="16" y="130" width="288" height="4" rx="2" fill="#2a3038"/>
    </svg>
  </div>
  <div class="feat">
    <span>Itinerary pages</span><span>Real budget numbers</span><span>Packing list</span>
    <span>Phrases</span><span>3-day local route</span><span>Day trips</span>
  </div>
  <div class="brand">TOKYO FIELD NOTES</div>
</div>
</body>
</html>
